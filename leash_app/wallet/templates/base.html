<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a78d6">
<title>{% block title %}Leash{% endblock %} · Wallet control</title>
<style>
:root{--page:#f4f6f9;--surface:#fff;--ink:#141a24;--ink2:#4a5466;--muted:#6b7485;--hair:#dde2ea;--accent:#2a78d6;--ok:#0b7a0b;--okbg:#e2f3e2;--no:#b42323;--nobg:#fbe4e4;--ask:#7a5200;--askbg:#fff0cc}
@media (prefers-color-scheme:dark){:root{--page:#0e1117;--surface:#171c25;--ink:#eef1f6;--ink2:#b7c0ce;--muted:#8e97a7;--hair:#2a3240;--accent:#5b9cf0;--ok:#7fda7f;--okbg:rgba(12,163,12,.18);--no:#ff9c9c;--nobg:rgba(208,59,59,.22);--ask:#ffd37a;--askbg:rgba(250,178,25,.18)}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--hair)}
header .in,main{max-width:1180px;margin:0 auto;padding-inline:20px}
header .in{display:flex;gap:22px;align-items:center;height:56px;overflow-x:auto}
header b{font-size:17px;white-space:nowrap}
header a{color:var(--ink2);text-decoration:none;white-space:nowrap}
header a.on,header a:hover{color:var(--accent)}
main{padding-block:26px 60px}
h1{font-size:26px;margin:0 0 6px} h2{font-size:18px;margin:26px 0 10px}
p{max-width:75ch}
.muted{color:var(--muted)} .small{font-size:13px}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
table{border-collapse:collapse;width:100%;background:var(--surface);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid var(--hair);text-align:left;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
code,pre,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
pre{background:var(--page);border:1px solid var(--hair);border-radius:8px;padding:12px;overflow:auto;max-height:420px}
input[type=text],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--hair);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
textarea{min-height:64px}
button,.btn{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--hair);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.good{background:var(--okbg);color:var(--ok);border-color:transparent}
button.bad{background:var(--nobg);color:var(--no);border-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.approved,.approve{background:var(--okbg);color:var(--ok)}
.rejected,.decline,.declined{background:var(--nobg);color:var(--no)}
.review_needed,.step_up,.pending{background:var(--askbg);color:var(--ask)}
.bars{display:flex;height:10px;border-radius:5px;overflow:hidden;min-width:120px;background:var(--hair)}
.bars span{display:block;height:100%}
.bars .a{background:#0ca30c}.bars .r{background:#d03b3b}.bars .v{background:#fab219}
.meter{height:8px;border-radius:4px;background:var(--hair);overflow:hidden;min-width:90px}
.meter span{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{background:var(--askbg);color:var(--ask);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.err{background:var(--nobg);color:var(--no);padding:10px 14px;border-radius:8px;margin-bottom:14px}
[hidden]{display:none!important}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:99px;background:var(--no);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
@media (max-width:640px){
  header .in,main{padding-inline:16px}
  header .in{gap:18px;height:52px}
  header b .long{display:none}
  main{padding-block:18px 48px}
  h1{font-size:22px}
  input[type=text],textarea,select{font-size:16px}
  button,.btn{min-height:40px}
  table{display:block;overflow-x:auto}
  /* .stack tables turn into one card per row on phones */
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack{overflow:visible}
  table.stack tr:has(th){display:none}
  table.stack tr{padding:10px 0;border-bottom:1px solid var(--hair)}
  table.stack td{border:0;padding:4px 12px}
  table.stack td[data-label]::before{content:attr(data-label);display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
}
</style>
</head>
<body>
<header><div class="in">
  <b>Leash<span class="long"> · wallet control</span></b>
  {% with p=request.path %}
  <a href="/" class="{% if p == '/' %}on{% endif %}">Dashboard</a>
  <a href="/queue/" class="{% if '/queue/' in p %}on{% endif %}">Queue{% if pending_count %}<span class="badge" id="nav-badge">{{ pending_count }}</span>{% endif %}</a>
  <a href="/rules/" class="{% if '/rules/' in p %}on{% endif %}">Write rules</a>
  <a href="/policies/" class="{% if '/policies/' in p %}on{% endif %}">Policies</a>
  <a href="/history/" class="{% if '/history/' in p %}on{% endif %}">History</a>
  <a href="/try/" class="{% if '/try/' in p %}on{% endif %}">Try a purchase</a>
  <a href="/connector/" class="{% if '/connector/' in p %}on{% endif %}">Live API</a>
  {% endwith %}
</div></header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
